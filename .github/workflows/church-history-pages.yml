# Publishes the redirect from the old Church History address to its new home
# (https://trogers34.github.io/church-history/) on every push to master.
name: Church History site

on:
  push:
    branches: [master]
    paths:
      - "church-history/**"
      - ".github/workflows/church-history-pages.yml"
  pull_request:
    paths:
      - "church-history/**"
      - ".github/workflows/church-history-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: church-history-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: church-history/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
